version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - unparam
    - unconvert
    - bodyclose
    - usestdlibvars
    - gosec
    - revive
    - thelper
    - paralleltest
    - errorlint
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: exported
  exclusions:
    paths:
      - scrape_magnets.go
    rules:
      # Fixtures de teste criam *http.Response fake sem ciclo de vida real;
      # o corpo é fechado pelo código sob teste (extractWithClient).
      - path: '(.+)_test\.go'
        linters:
          - bodyclose
    presets:
      - common-false-positives

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true

run:
  timeout: 5m